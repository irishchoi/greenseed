# ==========================================
# 🚀 GitHub Pages 자동 배포 워크플로우 (GitHub Actions)
# ==========================================
# 이 파일은 GitHub에 코드를 올렸을 때 자동으로 웹사이트를 인터넷에 공개(배포)해주는 자동화 로봇 설정입니다.

name: 고장재배장치 웹사이트 자동 배포

# 1. 언제 이 자동 배포 작업을 실행할 것인가? (트리거 조건)
on:
  # 'main' 브랜치나 'deploy/cultivation-landing' 브랜치에 코드 변경사항(push)이 올라오면 실행합니다.
  push:
    branches:
      - main
      - deploy/cultivation-landing

  # 사용자가 GitHub 웹페이지에서 버튼을 직접 눌러서 배포할 수도 있도록 허용합니다.
  workflow_dispatch:

# 2. GitHub Pages 배포에 필요한 보안 권한 설정
permissions:
  contents: read      # 저장소 코드 읽기 권한
  pages: write         # GitHub Pages 배포 권한
  id-token: write      # 안전한 인증 토큰 생성 권한

# 3. 동시에 여러 번 배포될 때 충돌을 방지하는 동시성 설정
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # [작업 1] 배포 (Deploy)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 단계 A: 저장소의 코드를 가상 서버로 가져오기 (Checkout)
      - name: 코드 가져오기 (Checkout)
        uses: actions/checkout@v4

      # 단계 B: GitHub Pages용 업로드 환경 설정하기
      - name: GitHub Pages 환경 설정
        uses: actions/configure-pages@v5

      # 단계 C: 배포할 웹사이트 파일들이 있는 폴더 업로드하기
      # (우리 프로젝트는 'cultivation_landing' 폴더 안에 index.html이 있습니다)
      - name: 정적 파일 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: './cultivation_landing'

      # 단계 D: 인터넷에 정식 배포하기!
      - name: GitHub Pages에 최종 배포
        id: deployment
        uses: actions/deploy-pages@v4
