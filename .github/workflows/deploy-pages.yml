# ==========================================
# 🚀 GitHub Pages 정적 웹사이트 자동 배포
# ==========================================
name: 고장재배장치 웹사이트 자동 배포

on:
  push:
    branches:
      - main
      - deploy/cultivation-landing
  workflow_dispatch:

# 배포 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2. GitHub Pages 설정
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 3. 배포할 정적 파일(cultivation_landing) 업로드
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'cultivation_landing'

      # 4. GitHub Pages에 최종 배포
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
